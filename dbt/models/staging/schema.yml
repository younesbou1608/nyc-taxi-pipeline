version: 2

models:
  - name: stg_trips
    description: Trajets normalises, un enregistrement par course.
    columns:
      - name: trip_key
        description: Cle de substitution du trajet.
        tests: [not_null]
      - name: pickup_at
        tests: [not_null]
      - name: pickup_zone_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_zones')
              field: zone_id
      - name: total_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5000
      - name: payment_type
        tests:
          - accepted_values:
              values: ['Credit card', 'Cash', 'No charge', 'Dispute', 'Unknown', 'Voided trip']

  - name: stg_zones
    columns:
      - name: zone_id
        tests: [not_null, unique]
