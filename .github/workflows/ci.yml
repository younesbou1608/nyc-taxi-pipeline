name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests dags scripts

      - name: Unit tests (PySpark)
        run: pytest -q

      # dbt parse compile le projet (Jinja, ref(), sources, YAML) sans se connecter a BigQuery.
      # Il echoue vraiment en cas d'erreur : plus de `|| echo` qui masquait les echecs.
      - name: dbt parse
        env:
          GCP_PROJECT_ID: ci-dummy-project
          BQ_RAW_DATASET: nyc_taxi_raw
          BQ_ANALYTICS_DATASET: nyc_taxi_analytics
        run: |
          cd dbt
          dbt deps
          dbt parse --profiles-dir .
