# Airflow 2.9 (standalone : scheduler + webserver) + Postgres.
# Prerequis dans .env : GCP_PROJECT_ID et AIRFLOW_UID (= `id -u`).
services:
  airflow:
    build: ./docker/airflow
    image: nyc-taxi-airflow:2.9.3
    container_name: nyc-airflow
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      NYC_PROJECT_DIR: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project
      DBT_BIN: /opt/airflow/dbt-venv/bin/dbt
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?GCP_PROJECT_ID manquant dans .env}
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      BQ_RAW_DATASET: ${BQ_RAW_DATASET:-nyc_taxi_raw}
      BQ_ANALYTICS_DATASET: ${BQ_ANALYTICS_DATASET:-nyc_taxi_analytics}
      BQ_LOCATION: ${BQ_LOCATION:-US}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcloud/adc.json
      SPARK_DRIVER_MEMORY: ${AIRFLOW_SPARK_DRIVER_MEMORY:-2g}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./dbt:/opt/airflow/project/dbt
      - ./data:/opt/airflow/project/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/gcloud/adc.json:ro
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
